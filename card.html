<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500&family=Lora:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body.card-page {
    background: linear-gradient(150deg, #fbf9f5 0%, #f1eee2 45%, #dfe6d3 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    max-width: 380px;
    width: 100%;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: 0 28px 56px -24px rgba(33, 28, 23, 0.18);
  }
  .card-photo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 15%;
    margin: 0 auto 20px;
    display: block;
    box-shadow: 0 12px 24px -12px rgba(33, 28, 23, 0.35);
  }
  .card h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .card-title {
    color: var(--accent-dark);
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    margin: 0 0 28px;
  }
  .card-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }
  .card-actions .button {
    width: 100%;
  }
  .card-socials {
    display: flex;
    justify-content: center;
    gap: 14px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .card-socials a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    color: var(--muted);
    border: 1px solid var(--line);
    transition: all 0.2s ease;
  }
  .card-socials a:hover {
    color: var(--accent-dark);
    border-color: var(--accent);
    background: var(--paper);
  }
  .card-socials svg {
    width: 19px;
    height: 19px;
    fill: currentColor;
  }
</style>
</head>
<body class="card-page">

<div class="card">
  <img src="images/hero-headshot.png" alt="McKenzie Rose" class="card-photo">
  <h1>McKenzie Rose</h1>

<script>
function saveContact() {
  const lines = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Rose;McKenzie;;;",
    "FN:McKenzie Rose",
    "TITLE:Beauty Educator & On-Camera Talent",
    "EMAIL:mckenzie@mckenzierose.co",
    "TEL;TYPE=CELL:+13478200268",
    "URL:https://mckenzierose.co",
    "END:VCARD"
  ];
  const blob = new Blob([lines.join("\r\n")], { type: "text/vcard" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mckenzie-rose.vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
